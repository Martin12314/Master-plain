<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>JWE Field Encrypt (Lab)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .status { padding:.5rem .75rem; border-radius:.5rem; display:inline-block; margin:.25rem 0; }
        .ok { background:#e8f7ee; color:#146c2e; border:1px solid #bfe7cc; }
        .fail { background:#ffecec; color:#8a1f11; border:1px solid #f5c0bc; }
        fieldset { margin:1rem 0; }
        label { display:block; margin:.35rem 0; }
        input, textarea { width:100%; padding:.5rem; box-sizing:border-box; }
        pre { white-space:pre-wrap; word-break:break-word; }
        .logbox {
          background:#0b1020;
          color:#d0d7ff;
          padding:1rem;
          border-radius:.5rem;
          max-height:260px;
          overflow:auto;
          font-size:.85rem;
        }
        .row { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
        .small { font-size:.9rem; color:#555; }
        code { background:#f6f8fa; padding:0 .25rem; border-radius:.25rem; }
    </style>
</head>
<body>

<h1>Pick fields/headers to encrypt (JWE)</h1>

<div id="kxStatus" class="status">Protected flow not initialized yet…</div>

<fieldset>
    <legend>Body</legend>
    <label>Name <input id="name" placeholder="alice"></label>
    <label>Age <input id="age" type="number" value="30"></label>
    <label>Message <textarea id="msg" rows="3" placeholder="hello"></textarea></label>
    <label><input type="checkbox" id="encName" checked> Encrypt name</label>
    <label><input type="checkbox" id="encMsg" checked> Encrypt message</label>
</fieldset>

<fieldset>
    <legend>Headers</legend>
    <label>X-Custom <input id="xhdr" placeholder="secret-header"></label>
    <label><input type="checkbox" id="encHdr"> Encrypt X-Custom header</label>
</fieldset>

<div class="row">
    <button id="sendBtn" disabled>Send</button>
</div>

<h3>Security + app log</h3>
<pre id="security-log" class="logbox">Waiting for Service Worker…</pre>

<h2>Response from Host</h2>
<pre id="out"></pre>

<script type="module">
    import { CompactEncrypt, importJWK } from 'https://cdn.jsdelivr.net/npm/jose@5.3.0/+esm';

    const secLog = document.getElementById('security-log');
    const sendBtn = document.getElementById('sendBtn');
    const out = document.getElementById('out');
    const kxStatus = document.getElementById('kxStatus');

    let jweKey = null;
    let jweKid = null;
    let kxOK = false;
    let reqSignOK = false;

    function nowTs() {
      return new Date().toISOString();
    }

    function appendLog(line) {
      secLog.textContent += line + '\n';
      secLog.scrollTop = secLog.scrollHeight;
    }

    function pageLog(...args) {
      appendLog(`[${nowTs()}] [PAGE] ${args.join(' ')}`);
    }

    function badge(ok, text) {
      kxStatus.textContent = text;
      kxStatus.className = 'status ' + (ok ? 'ok' : 'fail');
    }

    function shortValue(s) {
      if (!s) return s;
      if (s.length <= 90) return s;
      return s.slice(0, 45) + ' … ' + s.slice(-32) + ` (len=${s.length})`;
    }

    function refreshButtons() {
      sendBtn.disabled = !(kxOK && reqSignOK);
    }

    navigator.serviceWorker?.addEventListener('message', e => {
      if (e.data?.type === 'SW_LOG') {
        appendLog(`[${e.data.ts}] [SW] ${e.data.message}`);
      }
    });

    window.addEventListener('error', e => {
      pageLog('ERROR', e.message);
    });

    async function swActive() {
      const reg = await navigator.serviceWorker.ready;
      return navigator.serviceWorker.controller || reg.active || reg.waiting || reg.installing;
    }

    function waitForSWMessage(types, timeoutMs = 10000) {
      const wanted = new Set(Array.isArray(types) ? types : [types]);

      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          navigator.serviceWorker.removeEventListener('message', onMsg);
          reject(new Error('Timed out waiting for SW message: ' + Array.from(wanted).join(',')));
        }, timeoutMs);

        function onMsg(ev) {
          const type = ev?.data?.type;
          if (!wanted.has(type)) return;
          clearTimeout(timeout);
          navigator.serviceWorker.removeEventListener('message', onMsg);
          resolve(ev.data);
        }

        navigator.serviceWorker.addEventListener('message', onMsg);
      });
    }

    async function initProtectedFlow() {
      try {
        const active = await swActive();
        if (!active) {
          throw new Error('No active Service Worker');
        }

        pageLog('Requesting protected-flow state from Service Worker');
        const msgPromise = waitForSWMessage('PROTECTED_FLOW_STATE', 10000);
        active.postMessage({ type: 'GET_PROTECTED_FLOW_STATE' });
        const msg = await msgPromise;

        if (!msg?.ok) {
          throw new Error(msg?.message || 'SW protected-flow init failed');
        }

        const hostJwe = msg.hostJweJwk;
        if (!hostJwe?.n || !hostJwe?.e) {
          throw new Error('Missing host JWE key from Service Worker');
        }

        jweKid = hostJwe.kid || '(no-kid)';
        pageLog('Received host JWE key from SW kid=', jweKid);

        jweKey = await importJWK(
          { kty: 'RSA', n: hostJwe.n, e: hostJwe.e, alg: 'RSA-OAEP-256' },
          'RSA-OAEP-256'
        );

        kxOK = true;
        reqSignOK = !!msg.reqSignReady;

        badge(true, 'Protected flow OK (local SW keystore + SW request signing ready)');
        pageLog('Host JWE public key imported');
        pageLog('SW request-sign ready kid=', msg.reqSignKid || '(none)');
      } catch (e) {
        kxOK = false;
        reqSignOK = false;
        badge(false, 'Protected flow init failed: ' + (e.message || e));
        pageLog('Init failed:', e.message || String(e));
        console.error(e);
      } finally {
        refreshButtons();
      }
    }

    async function enc(plaintext) {
      const ce = new CompactEncrypt(new TextEncoder().encode(plaintext));
      ce.setProtectedHeader({ alg: 'RSA-OAEP-256', enc: 'A256GCM', kid: jweKid });
      return ce.encrypt(jweKey);
    }

    async function sendEcho() {
      if (!(kxOK && reqSignOK)) {
        throw new Error('Protected flow not ready. Check logs.');
      }
      if (!jweKey) {
        throw new Error('JWE key missing. Check logs.');
      }

      const name = document.getElementById('name').value || '';
      const age = Number(document.getElementById('age').value || 0);
      const msg = document.getElementById('msg').value || '';
      const encName = document.getElementById('encName').checked;
      const encMsg = document.getElementById('encMsg').checked;
      const xhdrVal = document.getElementById('xhdr').value || '';
      const encHdr = document.getElementById('encHdr').checked;

      pageLog('Preparing request → /api/echo');
      pageLog(
        'Selections:',
        `encName=${encName}`,
        `encMsg=${encMsg}`,
        `xhdr=${xhdrVal ? 'set' : 'empty'}`,
        `encHdr=${encHdr}`
      );

      const body = {
        name: encName ? ('JWE: ' + await enc(name)) : name,
        age,
        message: encMsg ? ('JWE: ' + await enc(msg)) : msg
      };

      const headers = { 'Content-Type': 'application/json' };
      if (xhdrVal) {
        if (encHdr) {
          headers['X-Enc-X-Custom'] = await enc(xhdrVal);
        } else {
          headers['X-Custom'] = xhdrVal;
        }
      }

      pageLog(
        'Request body preview:',
        `name=${encName ? 'JWE ' + shortValue(body.name) : JSON.stringify(body.name)}`,
        `age=${body.age}`,
        `message=${encMsg ? 'JWE ' + shortValue(body.message) : JSON.stringify(body.message)}`
      );

      if (headers['X-Custom']) {
        pageLog('Header X-Custom:', JSON.stringify(headers['X-Custom']));
      }
      if (headers['X-Enc-X-Custom']) {
        pageLog('Header X-Enc-X-Custom:', shortValue(headers['X-Enc-X-Custom']));
      }

      pageLog('Sending POST /api/echo');

      let response;
      try {
        response = await fetch('/api/echo', {
          method: 'POST',
          cache: 'no-store',
          headers,
          body: JSON.stringify(body)
        });
      } catch (e) {
        pageLog('NETWORK ERROR sending /api/echo:', e.message || String(e));
        throw e;
      }

      pageLog('Response HTTP', response.status, response.statusText);

      const text = await response.text();
      out.textContent = text;
      pageLog('Response body:', text);
    }

    sendBtn.addEventListener('click', e => {
      e.preventDefault();
      sendEcho().catch(err => {
        pageLog('Send ERROR:', err.message || String(err));
        alert('Send error: ' + (err.message || err));
      });
    });

    initProtectedFlow();
</script>

</body>
</html>
